# OS Gateway — stack complète (VPS ≥ 8 Go RAM recommandé)
#
# Local / VPS :
#   cp .env.example .env   # éditer les secrets
#   mvn -DskipTests package
#   docker compose up -d --build
#
# API (hôte) : http://127.0.0.1:18080
# Nginx hôte (prod) : deploy/ubuntu/nginx-osgateway.conf → HTTPS + frontend
#
# Observabilité (optionnel) :
#   docker compose --profile obs up -d
#
# Nginx dans Docker (optionnel, conflit avec Nginx hôte sur :80) :
#   docker compose --profile docker-nginx up -d

name: osgateway

services:
  postgres:
    image: postgres:16-alpine
    container_name: osg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-os_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-osgateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osgateway}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    networks: [osg-net]

  redis:
    image: redis:7-alpine
    container_name: osg-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    networks: [osg-net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: osg-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark float 0.6"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    networks: [osg-net]

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment: &svc-env
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-os_gateway}
      DB_USER: ${POSTGRES_USER:-osgateway}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-osgateway}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-osgateway-dev-secret-key-change-me-32chars-min}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -Xms128m -Xmx512m}
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 640m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [osg-net]

  user-service:
    build: ./user-service
    restart: unless-stopped
    environment:
      <<: *svc-env
      UPLOADS_DIR: /tmp/osgateway-uploads
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - uploads_data:/tmp/osgateway-uploads
    mem_limit: 640m
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [osg-net]

  gateway-service:
    build: ./gateway-service
    restart: unless-stopped
    environment: *svc-env
    ports:
      - "127.0.0.1:8083:8083"
    mem_limit: 640m
    depends_on:
      postgres: { condition: service_healthy }
    networks: [osg-net]

  ussd-service:
    build: ./ussd-service
    restart: unless-stopped
    environment:
      <<: *svc-env
      OPERATOR_LOGO_STORAGE: /app/data/operator-logos
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - ussd-logos:/app/data/operator-logos
    mem_limit: 640m
    depends_on:
      postgres: { condition: service_healthy }
    networks: [osg-net]

  sms-service:
    build: ./sms-service
    restart: unless-stopped
    environment: *svc-env
    ports:
      - "127.0.0.1:8085:8085"
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [osg-net]

  transaction-service:
    build: ./transaction-service
    restart: unless-stopped
    environment: *svc-env
    ports:
      - "127.0.0.1:8086:8086"
    mem_limit: 640m
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [osg-net]

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      <<: *svc-env
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/secrets/firebase-adminsdk.json}
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "127.0.0.1:8087:8087"
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [osg-net]

  audit-service:
    build: ./audit-service
    restart: unless-stopped
    environment: *svc-env
    ports:
      - "127.0.0.1:8088:8088"
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
    networks: [osg-net]

  reporting-service:
    build: ./reporting-service
    restart: unless-stopped
    environment: *svc-env
    ports:
      - "127.0.0.1:8089:8089"
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
    networks: [osg-net]

  scheduler-service:
    build: ./scheduler-service
    restart: unless-stopped
    environment:
      <<: *svc-env
      GATEWAY_SERVICE_URL: http://gateway-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8086
      USSD_SERVICE_URL: http://ussd-service:8084
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 512m
    depends_on:
      - gateway-service
      - transaction-service
      - rabbitmq
    networks: [osg-net]

  monitoring-service:
    build: ./monitoring-service
    restart: unless-stopped
    environment: *svc-env
    ports:
      - "127.0.0.1:8091:8091"
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
    networks: [osg-net]

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-osgateway-dev-secret-key-change-me-32chars-min}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-2000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -Xms128m -Xmx512m}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      GATEWAY_SERVICE_URL: http://gateway-service:8083
      USSD_SERVICE_URL: http://ussd-service:8084
      SMS_SERVICE_URL: http://sms-service:8085
      TRANSACTION_SERVICE_URL: http://transaction-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      AUDIT_SERVICE_URL: http://audit-service:8088
      REPORTING_SERVICE_URL: http://reporting-service:8089
      SCHEDULER_SERVICE_URL: http://scheduler-service:8090
      MONITORING_SERVICE_URL: http://monitoring-service:8091
    # Exposé sur localhost pour Nginx hôte (HTTPS)
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 640m
    depends_on:
      - auth-service
      - user-service
      - gateway-service
      - transaction-service
      - redis
    networks: [osg-net]

  # Optionnel : Nginx dans Docker (désactivé par défaut — utiliser Nginx hôte + Certbot)
  nginx:
    profiles: ["docker-nginx"]
    image: nginx:1.27-alpine
    container_name: osg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks: [osg-net]

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.54.1
    container_name: osg-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 384m
    networks: [osg-net]

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.2.0
    container_name: osg-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    mem_limit: 256m
    depends_on:
      - prometheus
    networks: [osg-net]

volumes:
  pgdata:
  uploads_data:
  ussd-logos:

networks:
  osg-net:
    driver: bridge
