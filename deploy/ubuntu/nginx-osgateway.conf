# Nginx — OS Gateway sur Ubuntu + Docker Compose (stack complète ≥8 Go)
# Backend Docker api-gateway : 127.0.0.1:18080
# Frontend static : /var/www/osgateway/frontend
#
# Sur le VPS :
#   cd /opt/backend_os_gateway
#   cp .env.example .env && nano .env
#   mvn -DskipTests package
#   docker compose up -d --build
#   # migrations : for f in sql/0{3..9}_*.sql sql/{1..3}*_*.sql; do
#   #   docker exec -i osg-postgres psql -U osgateway -d os_gateway < "$f"; done
#
#   sudo cp deploy/ubuntu/nginx-osgateway.conf /etc/nginx/sites-available/osgateway
#   sudo ln -sf /etc/nginx/sites-available/osgateway /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d osgateway.olive-services.net

upstream osg_api {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name osgateway.olive-services.net;

    client_max_body_size 20m;

    root /var/www/osgateway/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://osg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://osg_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /actuator/health {
        proxy_pass http://osg_api/actuator/health;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
